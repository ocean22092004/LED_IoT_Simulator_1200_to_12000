services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorial}
      POSTGRES_USER: ${POSTGRES_USER:-memorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorial}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memorial}:${POSTGRES_PASSWORD:-memorial}@postgres:5432/${POSTGRES_DB:-memorial}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-memorial}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-change-me}
      TECH_PASSWORD: ${TECH_PASSWORD:-change-me}
    command: ["uvicorn", "backend.app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 20

volumes:
  postgres-data:
  mosquitto-data:

