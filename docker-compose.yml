services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorial}
      POSTGRES_USER: ${POSTGRES_USER:-memorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorial}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://memorial:memorial@postgres:5432/memorial}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-memorial}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-change-me}
      TECH_PASSWORD: ${TECH_PASSWORD:-change-me}
      SIMULATOR_ADMIN_ENABLED: ${SIMULATOR_ADMIN_ENABLED:-true}
      SIMULATOR_INTERNAL_URL: ${SIMULATOR_INTERNAL_URL:-http://gateway-sim:8081}
      SIMULATOR_LOCATION_COUNT: ${SIMULATOR_LOCATION_COUNT:-1200}
      SIMULATOR_ZONES: ${SIMULATOR_ZONES:-A,B,C,D}
      SIMULATOR_LOCATIONS_PER_ZONE: ${SIMULATOR_LOCATIONS_PER_ZONE:-300}
      SIMULATOR_CONTROLLER_CAPACITY: ${SIMULATOR_CONTROLLER_CAPACITY:-64}
      DEVICE_HEARTBEAT_SECONDS: ${DEVICE_HEARTBEAT_SECONDS:-5}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS:-15}
      COMMAND_ACK_TIMEOUT_SECONDS: ${COMMAND_ACK_TIMEOUT_SECONDS:-5}
    command: ["uvicorn", "backend.app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 20

  command-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://memorial:memorial@postgres:5432/memorial}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-memorial}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    command: ["python", "-m", "backend.app.workers.command_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://memorial:memorial@postgres:5432/memorial}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS:-15}
    command: ["python", "-m", "backend.app.workers.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/scheduler-ready"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  device-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://memorial:memorial@postgres:5432/memorial}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-memorial}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    command: ["python", "-m", "backend.app.workers.device_consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/device-consumer-ready"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  gateway-sim:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-memorial}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      SIMULATOR_SITE_CODE: ${SIMULATOR_SITE_CODE:-SITE-001}
      SIMULATOR_LOCATION_COUNT: ${SIMULATOR_LOCATION_COUNT:-1200}
      SIMULATOR_LOCATIONS_PER_ZONE: ${SIMULATOR_LOCATIONS_PER_ZONE:-300}
      SIMULATOR_CONTROLLER_CAPACITY: ${SIMULATOR_CONTROLLER_CAPACITY:-64}
      SIMULATOR_ACK_DROP_RATE: ${SIMULATOR_ACK_DROP_RATE:-0.0}
      SIMULATOR_COMMAND_LATENCY_MS: ${SIMULATOR_COMMAND_LATENCY_MS:-0}
      SIMULATOR_CONTROL_HOST: ${SIMULATOR_CONTROL_HOST:-0.0.0.0}
      SIMULATOR_CONTROL_PORT: ${SIMULATOR_CONTROL_PORT:-8081}
      DEVICE_HEARTBEAT_SECONDS: ${DEVICE_HEARTBEAT_SECONDS:-5}
    expose:
      - "${SIMULATOR_CONTROL_PORT:-8081}"
    depends_on:
      device-consumer:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('SIMULATOR_CONTROL_PORT', '8081') + '/health/live', timeout=2)\""]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
